{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card p-4 shadow-sm border-0 rounded-4">
            <h3 class="fw-bold mb-3 text-center text-primary">Contact the College</h3>
            <p class="text-center text-muted">Send your inquiry to the administration or support team.</p>
            <form action="{{ url_for('contact') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" required placeholder="John Doe">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" required placeholder="johndoe@email.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">Your Message</label>
                    <textarea name="message" rows="4" class="form-control" required placeholder="Type your query here..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">Send Message</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
