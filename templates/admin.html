{% extends 'base.html' %}
{% block content %}
<div class="row">
    <div class="col-md-5 mb-4">
        <div class="card p-4 shadow-sm border-0 bg-white">
            <h4 class="fw-bold text-danger mb-3">Create New Notice</h4>
            <form action="{{ url_for('admin') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Notice Title</label>
                    <input type="text" name="title" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Notice Content</label>
                    <textarea name="content" rows="4" class="form-control" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Admin Pin Passphrase</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter code to post" required>
                </div>
                <button type="submit" class="btn btn-danger w-100 fw-bold">Broadcast Notice</button>
            </form>
        </div>
    </div>

    <div class="col-md-7">
        <h4 class="fw-bold text-secondary mb-3">Active Dashboard Management</h4>
        {% for notice in notices %}
            <div class="card mb-3 p-2 shadow-sm border-0 bg-white">
                <div class="card-body d-flex justify-content-between align-items-start">
                    <div>
                        <h6 class="fw-bold mb-1">{{ notice.title }}</h6>
                        <small class="text-muted">{{ notice.content[:80] }}...</small>
                    </div>
                    <form action="{{ url_for('delete_notice', notice_id=notice._id) }}" method="POST" class="d-flex gap-1">
                        <input type="password" name="delete_password" placeholder="Pin" class="form-control form-control-sm" style="width: 70px;" required>
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
